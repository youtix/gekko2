watch:
  assets:
    - BTC
  currency: USDT
  timeframe: 5m
  mode: realtime # backtest | importer | realtime

exchange:
  name: paper-binance
  simulationBalance:
    - assetName: BTC
      balance: 100
    - assetName: USDT
      balance: 300000

strategy:
  name: DebugAdvice
  each: 2 # one advice every 2 candles: a SELL, then a BUY, and so on
  wait: 0 # candles to let go by before the first advice

plugins:
  - name: TradingAdvisor
    strategyName: DebugAdvice

  - name: Trader

  - name: EventSubscriber
    token: # Your telegram bot token
    botUsername: # Your telegram bot username
    # chatId: 123456789 # Optional: the chat the bot talks to; without it, the first chat that sends it a command after start-up is bound
